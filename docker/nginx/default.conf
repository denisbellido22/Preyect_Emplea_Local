server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Laravel: todo lo que no sea un archivo real pasa por index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # PHP-FPM del servicio "app" dentro de la red interna de Docker.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Recursos compilados por Vite (CSS/JS) e imágenes subidas.
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # No exponer archivos ocultos (salvo los retos de Let's Encrypt).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
