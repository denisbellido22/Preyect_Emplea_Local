; Configuración de PHP para Emplea Local en Docker.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
max_input_time = 120
date.timezone = America/Lima

; Opcache: el código no cambia dentro de la imagen (se reconstruye al editar).
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Errores visibles sólo si APP_DEBUG lo permite; se registran en stderr.
display_errors = Off
log_errors = On
error_log = /dev/stderr
